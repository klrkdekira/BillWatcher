[project]
name = "billwatcher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "minio>=7.2.8",
    "starlette>=0.38.2",
    "uvicorn>=0.30.6",
    "gunicorn>=23.0.0",
    "jinja2>=3.1.4",
    "sqlalchemy>=2.0.32",
    "httpx>=0.27.0",
    "faker>=28.0.0",
    "anyio[trio]>=4.4.0",
    "beautifulsoup4>=4.12.3",
    "pymupdf>=1.24.9",
    "pymupdf4llm>=0.0.12",
    "ollama>=0.3.1",
    "llama-index>=0.11.1",
    "llama-index-embeddings-ollama>=0.3.0",
    "llama-parse>=0.5.0",
    "llama-index-llms-ollama>=0.3.0",
    "streamlit>=1.37.1",
    "llama-index-vector-stores-qdrant>=0.3.0",
    "llama-index-readers-file>=0.2.0",
    "llama-index-embeddings-fastembed>=0.2.0",
    "llama-index-llms-openai>=0.2.0",
    "qdrant-client>=1.11.1",
    "fastembed>=0.3.6",
    "llama-index-embeddings-huggingface>=0.3.1",
    "llama-index-embeddings-instructor>=0.2.1",
    "transformers>=4.44.2",
    "optimum[exporters]>=1.17.1",
    "sentence-transformers>=2.7.0",
    "einops>=0.8.0",
    "instructorembedding>=1.0.1",
    "llama-index-embeddings-huggingface-optimum>=0.2.0",
    "llama-index-finetuning>=0.2.0",
    "trio-asyncio>=0.15.0",
    "docling>=2.14.0",
    "jupyterlab>=4.3.4",
    "pandas>=2.2.3",
    "nltk>=3.9.1",
    "gensim>=4.3.2",
    "matplotlib>=3.10.0",
    "wordcloud>=1.9.4",
    "scipy==1.12",
    "polars>=1.19.0",
    "jupyter>=1.1.1",
    "ipywidgets>=8.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = ["ruff>=0.6.1", "mypy>=1.11.2"]

[tool.setuptools.package-data]
"billwatcher" = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
